 nav a {

/* Main Footer Content */

  display: flex;

  justify-content: space-between;
  align-items: center;
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.5s ease-in-out;
}

.footer-top:hover {
  transform: rotateY(3deg);
}

/* Logo + About */
.footer-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.footer-left img {
  height: 50px;
}

.footer-left a {

  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease-in-out;
}

.footer-left a:hover {

  text-shadow: 0 0 6px rgba(136,14,14,0.5), 0 0 12px rgba(136,14,14,0.5), 0 0 18px rgba(136,14,14,0.5);
}


.footer-right {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.footer-right a {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease-in-out;
}

.footer-right a:hover {
  color: #880e0e;
  text-shadow: 0 0 6px #880e0e, 0 0 12px  #880e0e, 0 0 18px  #880e0e;
}

/* Bottom Section */
.footer-bottom {
  max-width: 1200px;
  margin: 40px auto 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.5s ease-in-out;
}

.footer-bottom:hover {
  transform: rotateY(3deg);
}

.footer-bottom p {
  font-size: 14px;
  margin: 0;
}

.footer-bottom a {
  color: #fff;
  margin-left: 15px;
  text-decoration: underline;
  transition: all 0.3s ease-in-out;
}

.footer-bottom a:hover {
  color :#880e0e;
  text-shadow: 0 0 6px  #880e0e, 0 0 12px  #880e0e, 0 0 18px  #880e0e;
}
    
    .container { display: flex; justify-content: center; gap: 40px; max-width: 1200px; margin: auto; padding: 20px 0px; }
    .cart-items { flex: 2; }
    .cart-items h1 { margin-bottom: 15px; }
    .cart-item { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
    .cart-item div { flex: 1; }
    .cart-item h2 { font-size: 16px; margin: 0 0 5px; }
    .cart-item p { margin: 2px 0; color: #555; font-size: 14px; }
    .cart-item .actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
    .cart-item select { padding: 5px; border-radius: 5px; }
    .remove { background: #ff4d4d; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    .checkout { flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); height: fit-content; }
    .checkout input { width: 70%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    .checkout button.apply { padding: 8px 12px; margin-left: 5px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
    .summary { margin-top: 20px; }
    .summary div { display: flex; justify-content: space-between; margin: 8px 0; font-size: 15px; }
    .summary .total { font-size: 20px; font-weight: bold; margin-top: 10px; }
    .checkout-btn { margin-top: 20px; width: 100%; background: #007bff; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; cursor: pointer; }
</style>

<script>
// Example cart for testing
if(!localStorage.getItem("cart")){
    const exampleCart = [
        { title: "Red Shoes", price: "100", qty: 1, color: "Red", size: "42", image: "https://via.placeholder.com/80" },
        { title: "Blue T-Shirt", price: "50", qty: 2, color: "Blue", size: "M", image: "https://via.placeholder.com/80" }
    ];
    localStorage.setItem("cart", JSON.stringify(exampleCart));
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartContainer = document.getElementById("cart-container");
const summary = document.getElementById("summary");
let discount = 0;

function renderCart() {
    if(cart.length === 0){
        cartContainer.innerHTML = "<p>Your cart is empty.</p>";
        summary.innerHTML = "";
        return;
    }

    cartContainer.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <img src="${item.image}" alt="${item.title}">
            <div>
                <h2>${item.title}</h2>
                <p>Color: ${item.color}</p>
                <p>Size: ${item.size}</p>
                <p>Price: $${item.price} / per item</p>
            </div>
            <div class="actions">
                <select onchange="updateQty(${index}, this.value)">
                    ${[1,2,3,4,5].map(q => `<option ${item.qty==q?"selected":""}>Qty: ${q}</option>`).join("")}
                </select>
                <button class="remove" onclick="removeItem(${index})">X</button>
            </div>
        </div>
    `).join("");

    updateSummary();
}

function updateSummary(){
    // Convert price to number safely
let itemsTotal = cart.reduce((sum, item) => {
    let price = parseFloat(item.price.toString().replace(/[^0-9.]/g, ""));
    if(isNaN(price)) price = 0;
    return sum + price * item.qty;
}, 0);


    let delivery = 25;
    let tax = 14;
    let total = itemsTotal + delivery + tax - discount;

    summary.innerHTML = `
        <div><span>${cart.length} items</span> <span>$${itemsTotal.toFixed(2)}</span></div>
        <div><span>Delivery cost</span> <span>$${delivery}</span></div>
        <div><span>Tax</span> <span>$${tax}</span></div>
        <div><span>Discount</span> <span style="color:green">- $${discount}</span></div>
        <div class="total"><span>Total</span> <span>$${total.toFixed(2)}</span></div>
    `;
}

function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function updateQty(index, value){
    cart[index].qty = parseInt(value.replace("Qty: ", ""));
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function applyPromo(){
    const code = document.getElementById("promo").value.trim();
    if(code === "DISCOUNT10"){
        discount = 60; // مثال خصم ثابت
    } else {
        discount = 0;
        alert("Invalid promo code");
    }
    updateSummary();
}
const checkoutBtn = document.querySelector(".checkout-btn");
checkoutBtn.addEventListener("click", () => {
    // يذهب المستخدم إلى صفحة الدفع
   const checkoutBtn = document.querySelector(".checkout-btn");
checkoutBtn.addEventListener("click", () => {
    // تحويل المستخدم لصفحة الدفع
    window.location.href = '../Mode Paiment/modep.html';
});


});
  window.addEventListener('scroll', function() {
    const header = document.querySelector('header');
    if(window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
// First render
renderCart();
</script>
