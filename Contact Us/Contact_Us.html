<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <title>Contact Us</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f5f5;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background: #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: box-shadow 0.3s;
    }
    header.scrolled {
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    header .logo {
      font-weight: bold;
      font-size: 20px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s;
    }
    nav a.active {
      color: #880e0e;
    }
    nav a:hover {
      color: #880e0e;
    }
    nav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    nav input[type="search"] {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }
    nav .icons {
      display: flex;
      gap: 15px;
      margin-left: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    /* Hero Section */
    .hero {
      position: relative;
      background-size: cover;
      background-position: center;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background-image: url('C:/Users/Default.DESKTOP-67P6GFG/Desktop/projet1234/imags/image12.png');
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('C:/Users/Default.DESKTOP-67P6GFG/Desktop/projet1234/imags/image13.png') no-repeat center;
      background-size: cover;
      pointer-events: none;
    }
    .hero h1 {
      font-size: 50px;
      color: #000000;
      opacity: 0.5;
      max-width: 600px;
      margin: 0;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      z-index: 1; 
    }

    /* Contact Section */
  .contact-section {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 60px 10%;
  gap: 50px;
  min-height: 100vh;
   bottom: 50px; /* المسافة من التحت */
  right: 300px; /* المسافة من اليمين */

  /* صورتين فـ الخلفية */
  background: 
    url("C:/Users/Default.DESKTOP-67P6GFG/Desktop/projet1234/imags/image14.png") no-repeat left center,
    url("C:/Users/Default.DESKTOP-67P6GFG/Desktop/projet1234/imags/image15.png") no-repeat right center;

  background-size: 200% auto, 60% auto; /* كبر/صغر الصور */
}

    .contact-info {
      max-width: 350px;
      
      padding: 25px;
      border-radius: 10px;
    }
    .contact-info h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .contact-info p {
      margin-bottom: 20px;
      font-size: 16px;
    }
    .based-in {
      
      padding: 15px;
      margin-bottom: 30px;
    }
    .based-in h3 {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .social-icons {
      display: flex;
      gap: 20px;
    }
    .social-icons a {
      font-size: 25px;
      color: black;
      text-decoration: none;
    }
    /* Form */
    .contact-form {
      flex: 1;
    
      padding: 25px;
      border-radius: 10px;
    }
    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
        margin-bottom: 15px; /* هذه المسافة تفصل كل حقل عن الآخر */
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border: 2px solid #880e0e;

    }
    .contact-form textarea {
      resize: none;
      height: 120px;
    }
    .send-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    .send-btn:hover {
      background: #333;
    }
 /* Footer General */
footer {
  background: #000000ee;
  color: #fff;
  padding: 40px 20px;
  overflow: hidden;
}

/* Footer Top */
.footer-top {
  max-width: 1200px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.5s ease-in-out;
}

.footer-top:hover {
  transform: rotateY(3deg);
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.footer-left img {
  height: 50px;
}

.footer-left a {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease-in-out;
}

.footer-left a:hover {
  color: rgba(136,14,14,0.5);
  text-shadow: 0 0 6px rgba(136,14,14,0.5), 0 0 12px rgba(136,14,14,0.5), 0 0 18px rgba(136,14,14,0.5);
}

.footer-right {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.footer-right a {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease-in-out;
}

.footer-right a:hover {
  color: #880e0e;
  text-shadow: 0 0 6px #880e0e, 0 0 12px  #880e0e, 0 0 18px  #880e0e;
}

/* Footer Bottom */
.footer-bottom {
  max-width: 1200px;
  margin: 40px auto 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.5s ease-in-out;
}

.footer-bottom:hover {
  transform: rotateY(3deg);
}

.footer-bottom p {
  font-size: 14px;
  margin: 0;
}

.footer-bottom a {
  color: #fff;
  margin-left: 15px;
  text-decoration: underline;
  transition: all 0.3s ease-in-out;
}

.footer-bottom a:hover {
  color: #880e0e;
  text-shadow: 0 0 6px  #880e0e, 0 0 12px  #880e0e, 0 0 18px #880e0e;
}

/* Social Icons */
.footer-top .social-icons a i,
.footer-bottom .social-icons a i {
    color: #fff; /* default white */
    font-size: 18px;
    display: inline-block;
    transition: all 0.3s ease-in-out, transform 0.3s ease-in-out;
}

.footer-top .social-icons a:hover i,
.footer-bottom .social-icons a:hover i {
    color: #880e0e;
    transform: scale(1.2) translateY(-3px);
    text-shadow: 0 0 6px #880e0e, 0 0 12px #880e0e, 0 0 18px #880e0e;
}

  </style>
  <script src="https://kit.fontawesome.com/6e97f9f6ad.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <div class="logo">
       <img src="../imags/image5.png" alt="Logo">
    </div>
    <nav>
      <a href="..\Home Page\Home_Page.html" class="active">Home</a>
      <a href="#" onclick="window.location.href='Contact_Us.html'">Contact us</a>
      <a href="#">Categories</a>
      <input type="search" placeholder="Search">
      <div class="icons">
        <!-- Cart Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path d="M7 18c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zm10 0c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zM7.16 13h9.68c.55 0 1.04-.37 1.18-.91l2-7c.11-.39-.12-.79-.53-.79H5.21L4.27 2H1v2h2l3.6 7.59-1.35 2.44c-.14.25-.22.54-.22.84 0 1.104.896 2 2 2h12v-2H7.16z"/>
        </svg>
        <!-- Profile Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.88-2.18 4.88-4.88S14.7 2.24 12 2.24 7.12 4.42 7.12 7.12 9.3 12 12 12zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
        </svg>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Contact us</h1>
  </section>

  
  <section class="contact-section">
    <!-- Left Info -->
    <div class="contact-info">
      <h2>Contact</h2>
      <p>hi@green.com</p>

      <div class="based-in">
        <h3>Based in</h3>
        <p>MOROCCO , AGADIR<br>HAY SALAM</p>

    </div>

  
    <div class="contact-form">
      <form action="#" method="post">
        <div class="form-row">
          <input type="text" placeholder="First Name*" required>
          <input type="text" placeholder="Last Name*" required>

        <input type="email" placeholder="Email*" required>
        <input type="tel" placeholder="Phone Number*" required>
        <textarea placeholder="Your message..." required></textarea>
        <button type="submit" class="send-btn">Send Message</button>
      </form>

  <!-- Footer -->
<footer>
  <!-- Top Section -->
  <div class="footer-top">
    <div class="footer-left">
      <img src="../imags/image5.png" alt="Logo">
      <a href="../Home Page/Home_Page.html" class="active" onclick="window.location.href='Home_Page.html'">Home</a>
    </div>
    <div class="footer-right">
        <a href="#" onclick="window.location.href='Contact_Us.html'">Contact Us</a>
      <a href="#">Categories</a>
    </div>
 
  </div>

 
  <div class="footer-bottom">
    <p>
      &copy; 2025 WebStore. All rights reserved.
      <a href="#">Privacy Policy</a>

    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>

      <a href="#"><i class="fab fa-whatsapp"></i></a>

  </div>
</footer>

    <script>
  window.addEventListener('scroll', function() {
    const header = document.querySelector('header');
    if(window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
</script>

</body>
</html>
