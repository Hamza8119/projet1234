<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f5f5;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background: #e0e0e0;
    }
    header .logo {
      font-weight: bold;
      font-size: 20px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }
    nav a:hover {
      color: #880e0e;
    }
    nav input[type="search"] {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }
    nav .icons {
      display: flex;
      gap: 15px;
      margin-left: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .hero {
      position: relative;
      background-image: url('926f1e30-18d4-4b18-be6f-91437cb2d4f0.png');
      background-size: cover;
      background-position: center;
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 50px;
      color: white;
    }
    .hero h1 {
      font-size: 50px;
      max-width: 600px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    .hero button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: #fff;
      color: #880e0e;
      font-weight: bold;
    }
    .hero button:hover {
      background: #880e0e;
      color: #fff;
      transition: 0.3s;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Logo</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Contact us</a>
      <a href="#">Categories</a>
      <input type="search" placeholder="Search">
      <div class="icons">
        <span>&#128722;</span> <!-- shopping cart -->
        <span>&#128100;</span> <!-- user icon -->
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>DISCOVER UNIQUE LAMPS EVERY DAY</h1>
    <button>View all collections</button>
  </section>

</body>
</html>
