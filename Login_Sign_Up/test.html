<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
    }

    /* Left Section */
    .left {
      flex: 1;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                  url("https://www.transparenttextures.com/patterns/hexellence.png");
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .left h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .left p {
      margin-top: 20px;
      font-size: 16px;
    }

    .left button {
      margin-top: 15px;
      padding: 10px 30px;
      border: none;
      border-radius: 5px;
      background: white;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .left button:hover {
      background: #ddd;
    }

    /* Right Section */
    .right {
      flex: 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 40px;
    }

    .right h2 {
      color: #1a2b57;
      margin-bottom: 15px;
    }

    .social-icons {
      margin: 15px 0;
    }

    .social-icons a {
      margin: 0 8px;
      font-size: 22px;
      text-decoration: none;
    }

    .input-box {
      width: 100%;
      margin: 10px 0;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #d8e0eb;
      font-size: 15px;
    }

    .forgot {
      width: 100%;
      text-align: right;
      margin: 8px 0;
      font-size: 14px;
    }

    .forgot a {
      color: #1a2b57;
      text-decoration: none;
    }

    .signup-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #1a2b57;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .signup-btn:hover {
      background: #0e1833;
    }
  </style>
</head>
<body>

  <!-- Left Side -->
  <div class="left">
    <h2>Start New Journey!</h2>
    <p>Already have an account?</p>
    <button>Sign In</button>
  </div>

  <!-- Right Side -->
  <div class="right">
    <h2>Create Account</h2>

    <div class="social-icons">
      <a href="#">🔵</a>
      <a href="#">🔴</a>
      <a href="#">🔗</a>
    </div>
    <p>or use your email account</p>

    <div class="input-box">
      <input type="text" placeholder="Name">
    </div>
    <div class="input-box">
      <input type="email" placeholder="Email">
    </div>
    <div class="input-box">
      <input type="password" placeholder="Password">
    </div>

    <div class="forgot">
      <a href="#">Forgot your password?</a>
    </div>

    <button class="signup-btn">Sign Up</button>
  </div>

</body>
</html>
